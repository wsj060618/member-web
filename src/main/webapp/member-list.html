<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>会员管理系统</title>
    <link rel="stylesheet" href="css/site.css">
    <style>
        .list-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .btn-add{
            background-color: #409eff;
            color: #fff;
            text-decoration: none;
        }
        /* 痛点：列表只有标题和新增按钮，会员一多就无法按用户名/手机号快速查找 */
        .list-tools{
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .list-tools .search-input,
        .list-tools .btn-search{
            height: 30px;      /* 统一高度 */
            padding-top: 0;
            padding-bottom: 0;
        }
        .list-tools .search-input{
            width: 200px;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
        }
        .btn-search{
            display: inline-flex;
            align-items: center;
            background-color: #f5f7fa;
            color: #409eff;
            border: 1px solid #dcdfe6;
            text-decoration: none;
        }
        .btn-sm{
            display: inline-block;
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #409eff;
            background-color: #409eff;
            color: #fff;
            text-decoration: none;
        }
        .btn-sm.danger{
            border-color: #f56c6c;
            background-color: #f56c6c;
        }
        .btn-sm + .btn-sm{
            margin-left: 6px;
        }
    </style>
</head>
<body>
<header class="site-header">
    <h1>会员管理系统</h1>
    <nav>
        <a href="main.html">首页</a>&nbsp;<a href="register.html">注册</a>&nbsp;<a href="login.html">登录</a>&nbsp;<a href="member-list.html">会员列表</a>
    </nav>
</header>

<div class="container">
    <section class="card">
        <div class="list-header">
            <h2>会员列表</h2>
            <a class="btn btn-add" href="register.html">+ 新增会员</a>
        </div>
        <!-- 痛点：会员一多无法快速定位，补充独立一行的搜索入口（按用户名/手机号即时过滤） -->
        <div class="list-tools">
            <input type="text" class="search-input" placeholder="按用户名/手机号搜索" aria-label="按用户名/手机号搜索">
            >
            <a class="btn btn-search" href="#">搜索</a>
        </div>
        <!-- 痛点：删除是危险操作却无二次确认，点击即删——为每个“删除”增加确认提示 -->
        <table class="data">
            <thead>
            <tr>
                <th>编号</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>手机</th>
                <th>性别</th>
                <th>爱好</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>tom</td>
                <td>tom@x.com</td>
                <td>13800000001</td>
                <td>男</td>
                <td>运动</td>
                <td><a class="btn-sm" href="#">查看</a> <a class="btn-sm danger" href="#" onclick="return confirm('确定删除该会员？');">删除</a></td>
            </tr>
            <tr>
                <td>2</td>
                <td>jerry</td>
                <td>jerry@x.com</td>
                <td>13800000002</td>
                <td>男</td>
                <td>编程</td>
                <td><a class="btn-sm" href="#">查看</a> <a class="btn-sm danger" href="#" onclick="return confirm('确定删除该会员？');">删除</a></td>
            </tr>
            <tr>
                <td>3</td>
                <td>lily</td>
                <td>lily@x.com</td>
                <td>13800000003</td>
                <td>女</td>
                <td>阅读</td>
                <td><a class="btn-sm" href="#">查看</a> <a class="btn-sm danger" href="#" onclick="return confirm('确定删除该会员？');">删除</a></td>
            </tr>
            <tr>
                <td>4</td>
                <td>luck</td>
                <td>luck@x.com</td>
                <td>13800000004</td>
                <td>男</td>
                <td>音乐</td>
                <td><a class="btn-sm" href="#">查看</a> <a class="btn-sm danger" href="#" onclick="return confirm('确定删除该会员？');">删除</a></td>
            </tr>
            <tr>
                <td>5</td>
                <td>amy</td>
                <td>amy@x.com</td>
                <td>13800000005</td>
                <td>女</td>
                <td>运动</td>
                <td><a class="btn-sm" href="#">查看</a> <a class="btn-sm danger" href="#" onclick="return confirm('确定删除该会员？');">删除</a></td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

<footer class="site-footer">
    <p>&copy; 2026 长沙工业学院 • 应用程序设计课程</p>
</footer>

<script>
    // 痛点：列表无查找能力——输入关键字即时过滤行（用户名/手机号/邮箱均可匹配）
    document.querySelector('.search-input').addEventListener('input', function(){
        let kw = this.value.trim().toLowerCase();
        document.querySelectorAll('table.data tbody tr').forEach(function(row){
            let hit = kw === '' || row.innerText.toLowerCase().indexOf(kw) > -1;
            row.style.display = hit ? '' : 'none';
        });
    });
</script>

</body>
</html>
