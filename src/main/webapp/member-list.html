    <style>
        .list-header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .btn-add{
            background-color: #409eff;
            color: #fff;
            text-decoration: none;
        }
        /* 标题行右侧的按钮组，两个按钮并排、间距统一 */
        .header-actions{
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 列表只有标题和新增按钮，会员一多就无法按用户名/手机号快速查找 */
        .list-tools{
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .list-tools .search-input,
        .list-tools .btn-search{
            height: 30px;      /* 统一高度 */
            padding-top: 0;
            padding-bottom: 0;
        }
        .list-tools .search-input{
            width: 200px;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
        }
        .btn-search{
            display: inline-flex;
            align-items: center;
            background-color: #f5f7fa;
            color: #409eff;
            border: 1px solid #dcdfe6;
            text-decoration: none;
        }
        .btn-batchdel{
            background-color: #f56c6c;
            color: #fff;
            border: 1px solid #f56c6c;
            text-decoration: none;
        }
        .btn-sm{
            display: inline-block;
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #409eff;
            background-color: #409eff;
            color: #fff;
            text-decoration: none;
        }
        .btn-sm.danger{
            border-color: #f56c6c;
            background-color: #f56c6c;
        }
        .btn-sm + .btn-sm{
            margin-left: 6px;
        }
    </style>
</head>

<script>
    // 获取所有删除按钮
    let dels = document.querySelectorAll('.btn-sm.danger');

    // 为所有删除按钮绑定单击事件
    dels.forEach(function (del) {
        del.addEventListener('click', function (e) {
            if (confirm('确定删除该会员？')) {
                // 删除单条记录
                // del.parentNode.parentNode.remove();
                del.closest('tr').remove();
            }
        });
    });

    // 获取表头的复选框元素对象和所有每一行的复选框元素对象
    let checkAll = document.getElementById('checkAll');
    let rowChecks = document.querySelectorAll('.row-check');

    // 给表头复选框绑定点击事件：把所有行复选框的 checked 同步为表头的 checked
    checkAll.addEventListener('click', function () {
        rowChecks.forEach(function (rowCb) {
            rowCb.checked = checkAll.checked;   // 全选 / 全不选
        });
    });

    // 给每行复选框绑定点击事件：全部选中则表头选中，否则表头取消
    rowChecks.forEach(function (rowCb) {
        rowCb.addEventListener('click', function () {
            let total = rowChecks.length;                                        // 所有行复选框的长度
            let checkedCount = document.querySelectorAll('.row-check:checked').length; // 选中的长度
            checkAll.checked = (total === checkedCount);
        });
    });

    // 批量删除：删除所有被勾选的行
    let btnBatchDelete = document.getElementById('btnBatchDelete');
    btnBatchDelete.addEventListener('click', function (e) {
        e.preventDefault();
        // 每次都重新查询，避免静态 rowChecks 集合在删行后失效
        let checkedBoxes = document.querySelectorAll('.row-check:checked');
        if (checkedBoxes.length === 0) {
            alert('请先勾选要删除的会员');
            return;
        }
        if (confirm('确定删除选中的 ' + checkedBoxes.length + ' 条会员？')) {
            checkedBoxes.forEach(function (cb) {
                cb.closest('tr').remove();
                // TODO: 删除后端数据
            });
            checkAll.checked = false;   // 删完重置表头
        }
    });
