<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>会员管理系统</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="site-header">
    <h1>会员管理系统（基础版）</h1>
    <nav>
        <a href="main.html">首页</a><a href="register.html">注册</a><a href="login.html">登录</a>
    </nav>
</header>

<div class="container">
    <section class="card">
        <h2>会员注册</h2>
        <form id="regForm" action="#" method="post">
            <div class="form-item">
                <label for="username">用户名（必填）</label>
                <input type="text" id="username" name="username" placeholder="3~16位字母数字下划线">
            </div>

            <div class="form-item">
                <label for="password">密码（必填）</label>
                <input type="password" id="password" name="password" placeholder="6~16位字母数字">
            </div>

            <div class="form-item">
                <label for="confirmPwd">确认密码</label>
                <input type="password" id="confirmPwd" name="confirmPwd">
            </div>

            <div class="form-item">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="example@xx.com">
            </div>

            <div class="form-item">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone" placeholder="11位手机号">
            </div>

            <div class="form-item">
                <label for="gender_male">性别</label>
                <label><input type="radio" id="gender_male" name="gender" value="male" checked>&nbsp;男</label>
                <label><input type="radio" id="gender_female" name="gender" value="female">&nbsp;女</label>

            </div>

            <div class="form-item">
                <label for="hobby">爱好</label>
                <select id="hobby" name="hobby">
                    <option value="">请选择</option>
                    <option value="reading">阅读</option>
                    <option value="music">音乐</option>
                    <option value="traveling">旅行</option>
                    <option value="sports">运动</option>
                    <option value="coding">编程</option>
                </select>
            </div>

            <div class="form-item">
                <label for="remark">备注</label>
                <textarea id="remark" name="remark" placeholder="选填"></textarea>
            </div>

            <div class="form-item">
                <input type="submit" class="btn btn-submit" value="提交">
                <input type="reset" class="btn btn-reset" value="重置">
            </div>
        </form>
    </section>
</div>

<footer class="site-footer">
    <p>&copy; 2026 长沙工业学院 • 应用程序设计课程</p>
</footer>

<script>
    // 获取表单元素对象
    let form = document.querySelector('#regForm');

    // 为表单绑定提交事件
    form.addEventListener('submit', (e) => {
        // 阻止表单提交
        e.preventDefault();
        // 获取要校验的表单元素
        let username = document.querySelector('#username');
        let password = document.querySelector('#password');
        let confirmPwd = document.querySelector('#confirmPwd');
        let email = document.querySelector('#email');
        let phone = document.querySelector('#phone');

        // 校验表单数据
        // 用户名必须是3~16位字母、数字、下划线
        if (!/^[a-zA-Z0-9_]{3,16}$/.test(username.value)) {
            alert('用户名必须是3~16位字母、数字、下划线组合');
            username.focus();
            return;
        }
        // 密码必须是6~16位
        if (password.value.length < 6 || password.value.length > 16) {
            alert('密码长度必须是6~16位');
            password.focus();
            return;
        }
        // 确认密码必须和密码一致
        if (confirmPwd.value !== password.value) {
            alert('确认密码必须和密码一致');
            confirmPwd.focus();
            return;
        }
        // 邮箱格式必须正确
        if (!/[a-zA-Z0-9_-]+@[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+)+$/.test(email.value)) {
            alert('邮箱格式不正确');
            email.focus();
            return;
        }
        // 手机号长度必须是11位，必须以1开头，第二位必须是3~9的数字，第三位至11位必须都是数字。
        if (!/^1[3-9][0-9]{9}$/.test(phone.value)) {
            alert('手机号格式不正确');
            phone.focus();
            return;
        }

        form.submit();
    });


</script>
</body>
</html>
